<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=393, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="푸른 SOL - 신한장학재단 장학생 커뮤니티" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="푸른 SOL" />
    <title>푸른 SOL | 신한장학재단</title>
  </head>
  <body>
    <script>
      (function() {
        if (location.protocol !== 'https:') return;
        var ua = navigator.userAgent || '';
        if (/KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(ua)) {
          if (/iPhone|iPad/i.test(ua)) {
            location.href = 'x-safari-https://' + location.host + location.pathname + location.search + location.hash;
          } else {
            location.href = 'intent://' + location.host + location.pathname + location.search + location.hash + '#Intent;scheme=https;package=com.android.chrome;end';
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script>
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
